name: Setup
description: Install Rust toolchain and system dependencies

inputs:
  components:
    description: "Rust toolchain components (comma-separated, optional)"
    required: false

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}

    - uses: Swatinem/rust-cache@v2

    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libglib2.0-dev \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libxdo-dev
